<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fluid Simulation</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Log in to access your simulations</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span>Log In</span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Sign up here</a>
        </div>

        <div style="margin-top: 1.2rem; text-align: center;">
            <a href="calculator.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 0.7rem 1.4rem; background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3); border-radius: 0.75rem; color: #818cf8; font-size: 0.9rem; font-weight: 500; text-decoration: none; transition: all 0.3s ease;"
               onmouseover="this.style.background='rgba(99,102,241,0.22)'; this.style.transform='translateY(-2px)'"
               onmouseout="this.style.background='rgba(99,102,241,0.12)'; this.style.transform='translateY(0)'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/>
                </svg>
                Open Scientific Calculator
            </a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
